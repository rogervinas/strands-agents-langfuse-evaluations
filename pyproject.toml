[project]
name = "banking-sentinel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[ollama,gemini,otel]==1.63.0",
    "strands-agents-tools==0.8.12",
    "langfuse==5.1.0",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
]
evals = [
    "strands-agents-evals==1.8.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_sentinel"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
